<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eee9df">
    <title>Home / Время</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');

        :root {
            --background: #eee9df;
            --background-deep: #d8d2c7;
            --ink: #20201e;
            --muted: rgba(32, 32, 30, 0.5);
            --line: rgba(32, 32, 30, 0.16);
            --field: rgba(255, 255, 255, 0.34);
            --accent: #cf5b3d;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            overflow: hidden;
            color: var(--ink);
            background: var(--background);
            font-family: 'Manrope', sans-serif;
            transition: color 1.8s ease, background 1.8s ease;
        }

        body::before {
            position: fixed;
            inset: -20%;
            z-index: -1;
            content: '';
            background:
                radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.27), transparent 30%),
                radial-gradient(circle at 20% 90%, rgba(185, 121, 86, 0.11), transparent 31%);
            filter: blur(12px);
            pointer-events: none;
        }

        body::after {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 170px;
            z-index: -1;
            content: '';
            opacity: 0.32;
            background:
                radial-gradient(ellipse at 50% -18%, rgba(255, 91, 38, 0.58), transparent 58%),
                repeating-radial-gradient(ellipse at 50% 100%, transparent 0 14px, var(--accent) 15px 17px, transparent 18px 31px);
            -webkit-mask-image: linear-gradient(to bottom, black, transparent);
            mask-image: linear-gradient(to bottom, black, transparent);
            filter: blur(0.2px);
            animation: wave-drift 18s linear infinite;
            pointer-events: none;
        }

        .page::after {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            height: 175px;
            z-index: -1;
            content: '';
            opacity: 0.3;
            background:
                radial-gradient(ellipse at 50% 118%, rgba(255, 91, 38, 0.52), transparent 58%),
                repeating-radial-gradient(ellipse at 50% 0, transparent 0 14px, var(--accent) 15px 17px, transparent 18px 31px);
            -webkit-mask-image: linear-gradient(to top, black, transparent);
            mask-image: linear-gradient(to top, black, transparent);
            filter: blur(0.2px);
            animation: wave-drift-reverse 22s linear infinite;
            pointer-events: none;
        }

        .page {
            display: flex;
            min-height: 100svh;
            padding: clamp(28px, 5vw, 72px);
            flex-direction: column;
            justify-content: space-between;
        }

        .topline, .search-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .topline { animation: appear 900ms ease both; }
        .topline { justify-content: center; gap: 15px; }

        .calendar-widget {
            display: grid;
            width: 238px;
            min-height: 86px;
            padding: 13px 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--field);
            backdrop-filter: blur(18px);
            grid-template-columns: 1fr auto;
            grid-template-rows: auto 1fr;
            column-gap: 22px;
            row-gap: 8px;
            text-align: left;
        }

        .calendar-label, .calendar-month {
            color: var(--muted);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .calendar-label { grid-column: 1; }
        .calendar-weekday {
            align-self: start;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-align: right;
            text-transform: uppercase;
        }
        .calendar-main { display: flex; align-items: end; gap: 10px; grid-column: 1 / -1; }
        .calendar-day { font-size: 32px; font-weight: 600; line-height: 0.82; }
        .calendar-month { align-self: end; margin-bottom: 1px; }

        .signal {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .signal::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent);
            content: '';
        }

        .clock-stage {
            align-self: center;
            width: min(100%, 720px);
            margin: auto 0;
            text-align: center;
            animation: rise 1100ms 120ms ease both;
        }

        .clock-label {
            margin: 0 0 15px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .clock {
            margin: 0;
            font-size: clamp(72px, 14vw, 168px);
            font-weight: 500;
            letter-spacing: -0.07em;
            line-height: 0.85;
        }

        .clock-zone {
            display: block;
            margin-top: 27px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: clamp(12px, 1.4vw, 15px);
            text-align: center;
        }

        .city-time { color: var(--ink); }
        .city-time strong { margin-left: 11px; font-weight: 400; }
        .clock-date { margin-top: 9px; color: var(--muted); font-size: 11px; }

        .search-wrap {
            align-self: center;
            width: min(100%, 620px);
            animation: rise 1100ms 240ms ease both;
        }

        .search-form {
            display: flex;
            align-items: center;
            min-height: 68px;
            padding: 0 11px 0 22px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--field);
            backdrop-filter: blur(18px);
            transition: border-color 300ms ease, background 300ms ease, transform 300ms ease;
        }

        .search-form:focus-within {
            border-color: color-mix(in srgb, var(--ink) 45%, transparent);
            background: color-mix(in srgb, var(--field) 80%, white);
            transform: translateY(-2px);
        }

        .search-icon { width: 20px; height: 20px; margin-right: 14px; opacity: 0.56; }

        .search-input {
            min-width: 0;
            flex: 1;
            border: 0;
            outline: 0;
            color: var(--ink);
            background: transparent;
            font: inherit;
            font-size: 15px;
        }

        .search-input::placeholder { color: var(--muted); }

        .search-submit {
            display: grid;
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            place-items: center;
            border: 0;
            border-radius: 18px;
            color: var(--background);
            background: var(--ink);
            cursor: pointer;
            transition: transform 250ms ease, background 250ms ease;
        }

        .search-submit:hover { background: var(--accent); transform: rotate(-8deg); }
        .search-submit svg { width: 17px; height: 17px; }

        @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes wave-drift { from { background-position: 0 0; } to { background-position: 58px 0; } }
        @keyframes wave-drift-reverse { from { background-position: 0 0; } to { background-position: -72px 0; } }

        @media (max-width: 560px) {
            .page { padding: 27px 22px 30px; }
            .topline { flex-direction: column; gap: 10px; }
            .calendar-widget { width: min(238px, calc(100vw - 44px)); min-width: 136px; padding: 11px 14px; }
            .clock { font-size: clamp(65px, 21vw, 105px); }
            .clock-stage { margin-bottom: 28vh; }
            .search-form { min-height: 60px; padding-left: 18px; }
            .search-submit { width: 42px; height: 42px; flex-basis: 42px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topline">
            <div class="calendar-widget" aria-label="Календарь">
                <span class="calendar-label">День</span>
                <span class="calendar-weekday" id="calendar-weekday">---</span>
                <div class="calendar-main">
                    <span class="calendar-day" id="calendar-day">--</span>
                    <span class="calendar-month" id="calendar-month">---</span>
                </div>
            </div>
            <span class="signal" id="daypart">День</span>
        </header>

        <section class="clock-stage" aria-label="Текущее время">
            <h1 class="clock" id="moscow-time">00:00</h1>
            <div class="clock-zone">
                <div class="city-time">Владивосток <strong id="vladivostok-time">00:00</strong></div>
                <div class="clock-date" id="moscow-date">--</div>
            </div>
        </section>

        <section class="search-wrap" aria-label="Поиск">
            <form class="search-form" action="https://www.google.com/search" method="get">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path>
                </svg>
                <input class="search-input" name="q" type="search" placeholder="Поиск в интернете" autocomplete="off" autofocus>
                <button class="search-submit" type="submit" aria-label="Искать">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
                </button>
            </form>
        </section>
    </main>

    <script>
        const root = document.documentElement;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
        const dateOptions = { day: '2-digit', month: 'long', year: 'numeric' };

        function updateHome() {
            const now = new Date();
            const hour = now.getHours();
            const colors = hour < 6
                ? ['#090a0a', '#171918', '#f0ece4', '#e8e4db']
                : hour < 11
                    ? ['#eee9df', '#d8d2c7', '#20201e', '#eee9df']
                    : hour < 18
                        ? ['#bab9b3', '#8d8e89', '#20211f', '#d8d7d0']
                        : hour < 22
                            ? ['#4a4c4a', '#242725', '#f0ece4', '#30322f']
                            : ['#090a0a', '#171918', '#f0ece4', '#e8e4db'];

            root.style.setProperty('--background', colors[0]);
            root.style.setProperty('--background-deep', colors[1]);
            root.style.setProperty('--ink', colors[2]);
            root.style.setProperty('--field', colors[3] + '55');
            themeColor.content = colors[0];

            document.querySelector('#moscow-time').textContent = new Intl.DateTimeFormat('ru-RU', { ...timeOptions, timeZone: 'Europe/Moscow' }).format(now);
            document.querySelector('#vladivostok-time').textContent = new Intl.DateTimeFormat('ru-RU', { ...timeOptions, timeZone: 'Asia/Vladivostok' }).format(now);
            document.querySelector('#moscow-date').textContent = new Intl.DateTimeFormat('ru-RU', { ...dateOptions, timeZone: 'Europe/Moscow' }).format(now);
            const calendarDate = new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: 'short', timeZone: 'Europe/Moscow' }).formatToParts(now);
            document.querySelector('#calendar-day').textContent = calendarDate.find((part) => part.type === 'day').value;
            document.querySelector('#calendar-month').textContent = calendarDate.find((part) => part.type === 'month').value.replace('.', '');
            document.querySelector('#calendar-weekday').textContent = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', timeZone: 'Europe/Moscow' }).format(now);
            document.querySelector('#daypart').textContent = hour < 6 || hour >= 22 ? 'Ночь' : hour < 11 ? 'Утро' : hour < 18 ? 'День' : 'Вечер';
        }

        updateHome();
        setInterval(updateHome, 1000);
    </script>
</body>
</html>
