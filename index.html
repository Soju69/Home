<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eee9df">
    <title>Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DotGothic16&family=Manrope:wght@400;500;600;700&display=swap');

        :root {
            --background: #303432;
            --background-deep: #181b1a;
            --ink: #f2eee6;
            --muted: rgba(242, 238, 230, 0.58);
            --line: rgba(242, 238, 230, 0.22);
            --field: rgba(8, 10, 10, 0.38);
            --accent: #cf5b3d;
            --glass-edge: rgba(242, 238, 230, 0.3);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            overflow-x: hidden;
            color: var(--ink);
            background: var(--background);
            font-family: 'Manrope', sans-serif;
            transition: color 1.8s ease, background 1.8s ease;
        }

        body::before {
            position: fixed;
            inset: -20%;
            z-index: -1;
            content: '';
            background:
                radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.11), transparent 30%),
                radial-gradient(circle at 20% 90%, rgba(185, 121, 86, 0.08), transparent 31%);
            filter: blur(12px);
            pointer-events: none;
        }

        .page {
            display: flex;
            position: relative;
            min-height: 100svh;
            padding: clamp(20px, 3.8vw, 56px) clamp(28px, 5vw, 72px) clamp(20px, 3vw, 42px);
            flex-direction: column;
            justify-content: space-between;
        }

        .topline {
            display: grid;
            grid-template-columns: minmax(0, 400px) minmax(220px, 270px);
            align-items: start;
            justify-content: center;
            gap: 14px;
            align-self: center;
            transform: translateY(-8px);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .topline { animation: appear 900ms ease both; }

        .travel-widget {
            width: 100%;
            padding: 16px 17px;
            border: 1px solid rgba(242, 238, 230, 0.2);
            border-radius: 18px;
            color: var(--ink);
            background: rgba(8, 10, 10, 0.36);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            font-family: 'DM Mono', monospace;
        }

        .travel-header, .travel-route, .travel-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .travel-kicker, .travel-date, .travel-footer {
            color: var(--muted);
            font-size: 8px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .travel-kicker::before {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin-right: 8px;
            border-radius: 50%;
            background: #e6a052;
            box-shadow: 0 0 10px rgba(230, 160, 82, 0.75);
            content: '';
        }

        .travel-countdown {
            color: #e6a052;
            font-family: 'DotGothic16', monospace;
            font-size: 20px;
            letter-spacing: -0.04em;
        }

        .travel-route { gap: 8px; margin: 21px 0 13px; }
        .travel-city { font-size: 10px; letter-spacing: 0.05em; }
        .travel-line {
            position: relative;
            height: 1px;
            flex: 1;
            background: rgba(242, 238, 230, 0.25);
        }

        .travel-line::before {
            position: absolute;
            top: -2px;
            left: 0;
            width: 5px;
            height: 5px;
            border-radius: 1px;
            background: #e6a052;
            box-shadow: 0 0 12px rgba(230, 160, 82, 0.85);
            content: '';
            transform: rotate(45deg);
            animation: travel-marker 4.5s ease-in-out infinite;
        }

        .travel-footer { padding-top: 10px; border-top: 1px solid rgba(242, 238, 230, 0.12); }
        .travel-footer strong { color: var(--ink); font-weight: 400; }

        @keyframes travel-marker {
            0%, 12% { left: 0; opacity: 0.45; }
            44% { left: 48%; opacity: 1; }
            82%, 100% { left: calc(100% - 5px); opacity: 0.55; }
        }

        .finance-widget {
            position: relative;
            z-index: 3;
            width: min(100%, 400px);
            padding: 16px 18px;
            border: 1px solid var(--glass-edge);
            border-radius: 18px;
            color: var(--ink);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 42%), rgba(8, 10, 10, 0.52);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px);
            transition: background 350ms ease, box-shadow 350ms ease;
            font-family: 'DotGothic16', 'DM Mono', monospace;
            cursor: pointer;
        }

        .finance-widget.is-open {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 38%), #050606;
            border-color: rgba(170, 170, 170, 0.72);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
        }

        .finance-summary {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 4px 14px;
            align-items: end;
            cursor: pointer;
        }

        .widget-kicker, .progress-label, .input-label {
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .widget-kicker { position: relative; grid-column: 1; padding-left: 13px; }
        .widget-kicker::before {
            position: absolute;
            top: 50%;
            left: 0;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(207, 91, 61, 0.75);
            content: '';
            transform: translateY(-50%);
        }
        .amount {
            display: block;
            margin-top: 4px;
            font-family: 'DotGothic16', 'DM Mono', monospace;
            font-size: clamp(24px, 4vw, 34px);
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 0.95;
            font-variant-numeric: tabular-nums;
        }

        .progress-stack { display: grid; gap: 12px; margin-top: 16px; }
        .progress-row { display: grid; gap: 6px; }
        .progress-label { display: flex; justify-content: space-between; color: rgba(242, 238, 230, 0.68); }
        .progress-label span:last-child { color: var(--ink); font-weight: 500; }
        .progress-track { display: flex; gap: 1px; height: 6px; }
        .progress-tick { flex: 1; min-width: 1px; border-radius: 1px; background: rgba(220, 220, 215, 0.28); transition: background 350ms ease; }
        .progress-tick.period-active { background: #e3663c; }
        .money-track { display: block; height: 7px; border-radius: 2px; background: rgba(220, 220, 215, 0.22); overflow: hidden; }
        .money-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: hsl(var(--green-hue, 105) 48% 42%); transition: width 500ms ease, background 500ms ease; }
        .progress-endpoints { display: flex; justify-content: space-between; color: var(--muted); font: 8px 'DM Mono', monospace; }

        .finance-details {
            display: grid;
            grid-template-rows: 0fr;
            padding: 0;
            opacity: 0;
            transition: grid-template-rows 460ms ease, opacity 220ms ease, padding 460ms ease;
        }

        .is-open .finance-details { grid-template-rows: 1fr; padding: 16px 0 0; opacity: 1; }
        .details-inner { min-height: 0; overflow: hidden; }

        .finance-details, .finance-details button, .finance-details input { cursor: default; }

        .calendar-months {
            display: grid;
            gap: 7px;
            margin-bottom: 6px;
            color: var(--muted);
            font: 8px 'DM Mono', monospace;
            text-transform: uppercase;
        }

        .calendar-months span { white-space: nowrap; }

        .earnings-grid {
            display: grid;
            grid-template-rows: repeat(7, 8px);
            grid-auto-flow: column;
            grid-auto-columns: 8px;
            gap: 5px;
            padding: 2px 0 18px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
        }

        .earning-day {
            display: grid;
            width: 8px;
            height: 8px;
            padding: 0;
            place-items: center;
            border: 0;
            border-radius: 1.5px;
            color: transparent;
            background: rgba(220, 220, 215, 0.28);
            font-size: 0;
            cursor: pointer;
            transition: transform 180ms ease, background 250ms ease, box-shadow 250ms ease;
        }

        .earning-day:hover { transform: scale(1.35); }
        .earning-day.level-1 { color: #33230b; background: #f3c84b; }
        .earning-day.level-2 { color: #fff2e7; background: #e87932; }
        .earning-day.level-3 { color: #fff5ee; background: #b64227; }
        .earning-day.is-today { box-shadow: none; }

        .entry-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 20px; }
        .input-label { display: grid; gap: 6px; }
        .entry-input {
            width: 100%;
            min-height: 38px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: 0;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.07);
            font: 12px 'DM Mono', monospace;
        }

        .entry-input:focus { border-color: var(--ink); }
        .entry-submit { min-height: 38px; padding: 0 15px; border: 1px solid var(--ink); border-radius: 10px; color: #101211; background: var(--ink); cursor: pointer; font: 10px 'DM Mono', monospace; text-transform: uppercase; transition: background 220ms ease, color 220ms ease, transform 220ms ease; }
        .entry-submit:hover { background: var(--accent); }
        .entry-note { min-height: 14px; margin: 10px 0 0; color: var(--muted); font: 10px 'DM Mono', monospace; }

        .signal {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .signal::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent);
            content: '';
        }

        .clock-stage {
            align-self: center;
            width: min(100%, 720px);
            margin: auto 0;
            text-align: center;
            animation: rise 1100ms 120ms ease both;
        }

        .clock-label {
            margin: 0 0 15px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .clock {
            margin: 0;
            font-size: clamp(72px, 14vw, 168px);
            font-weight: 400;
            letter-spacing: -0.07em;
            line-height: 0.85;
        }

        .clock-zone {
            display: block;
            margin-top: 27px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: clamp(12px, 1.4vw, 15px);
            text-align: center;
        }

        .city-time { color: var(--ink); }
        .city-time strong { margin-left: 11px; font-weight: 400; }
        .clock-date { margin-top: 9px; color: var(--muted); font-size: 11px; }

        .search-wrap {
            align-self: center;
            width: min(100%, 620px);
            transform: translateY(12px);
            animation: rise 1100ms 240ms ease both;
        }

        .search-form {
            display: flex;
            align-items: center;
            min-height: 68px;
            padding: 0 11px 0 22px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), transparent 48%), var(--field);
            backdrop-filter: blur(18px);
            transition: border-color 300ms ease, background 300ms ease, transform 300ms ease;
        }

        .search-form:focus-within {
            border-color: color-mix(in srgb, var(--ink) 45%, transparent);
            background: color-mix(in srgb, var(--field) 80%, white);
            transform: translateY(-2px);
        }

        .search-icon { width: 20px; height: 20px; margin-right: 14px; opacity: 0.56; }

        .search-input {
            min-width: 0;
            flex: 1;
            border: 0;
            outline: 0;
            color: var(--ink);
            background: transparent;
            font: inherit;
            font-size: 15px;
        }

        .search-input::placeholder { color: var(--muted); }

        .search-submit {
            display: grid;
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            place-items: center;
            border: 0;
            border-radius: 18px;
            color: var(--background);
            background: var(--ink);
            cursor: pointer;
            transition: transform 250ms ease, background 250ms ease;
        }

        .search-submit:hover { background: var(--accent); transform: rotate(-8deg); }
        .search-submit svg { width: 17px; height: 17px; }

        :focus-visible { outline: none; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 560px) {
            .page { padding: 27px 22px 30px; }
            .topline { grid-template-columns: 1fr; gap: 10px; }
            .finance-widget { width: min(100%, 400px); padding: 14px; }
            .travel-widget { width: min(100%, 400px); }
            .entry-form { grid-template-columns: 1fr 1fr; }
            .entry-submit { grid-column: 1 / -1; }
            .clock { font-size: clamp(65px, 21vw, 105px); }
            .clock-stage { margin-bottom: 28vh; }
            .search-form { min-height: 60px; padding-left: 18px; }
            .search-submit { width: 42px; height: 42px; flex-basis: 42px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topline">
            <div class="finance-widget" id="finance-widget" role="button" tabindex="0" aria-expanded="false" aria-controls="finance-details">
                <div class="finance-summary">
                    <div class="widget-kicker">Финансовый трекер</div>
                    <strong class="amount" id="current-amount">0 ₽</strong>
                </div>

                <div class="progress-stack">
                    <div class="progress-row">
                        <div class="progress-label"><span>До 20 декабря</span><span id="period-progress">0%</span></div>
                        <div class="progress-track" id="period-track" aria-label="Прогресс времени"></div>
                        <div class="progress-endpoints"><span>1 сентября</span><span>20 декабря</span></div>
                    </div>
                    <div class="progress-row">
                        <div class="progress-label"><span>Накопления</span><span id="money-progress">0%</span></div>
                        <div class="money-track" aria-label="Прогресс накоплений"><span class="money-fill" id="money-track"></span></div>
                        <div class="progress-endpoints"><span>0 ₽</span><span>350к</span></div>
                    </div>
                </div>

                <div class="finance-details" id="finance-details">
                    <div class="details-inner">
                        <div class="calendar-months" id="calendar-months" aria-hidden="true"></div>
                        <div class="earnings-grid" id="earnings-grid" aria-label="Поступления по дням"></div>
                        <form class="entry-form" id="entry-form">
                            <label class="input-label">Дата<input class="entry-input" id="entry-date" type="date" required></label>
                            <label class="input-label">Сумма<input class="entry-input" id="entry-amount" type="number" min="0" step="100" placeholder="₽" required></label>
                            <button class="entry-submit" type="submit">Добавить</button>
                        </form>
                        <p class="entry-note" id="entry-note">Нажмите на день, чтобы выбрать его для записи.</p>
                    </div>
                </div>
            </div>
            <article class="travel-widget" aria-label="План поездки">
                <div class="travel-header">
                    <span class="travel-kicker">Следующий маршрут</span>
                    <strong class="travel-countdown" id="travel-countdown">D-97</strong>
                </div>
                <div class="travel-route">
                    <span class="travel-city">ВРН</span>
                    <span class="travel-line"></span>
                    <span class="travel-city">МСК</span>
                    <span class="travel-line"></span>
                    <span class="travel-city">ХБР</span>
                </div>
                <div class="travel-footer">
                    <span>вылет <strong>25 дек</strong></span>
                    <span>путь на восток</span>
                </div>
            </article>
        </header>

        <section class="clock-stage" aria-label="Текущее время">
            <h1 class="clock" id="moscow-time">00:00</h1>
            <div class="clock-zone">
                <div class="city-time">Владивосток <strong id="vladivostok-time">00:00</strong></div>
                <div class="clock-date" id="moscow-date">--</div>
            </div>
        </section>

        <section class="search-wrap" aria-label="Поиск">
            <form class="search-form" action="https://www.google.com/search" method="get">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path>
                </svg>
                <input class="search-input" name="q" type="search" placeholder="Поиск в интернете" autocomplete="off" autofocus>
                <button class="search-submit" type="submit" aria-label="Искать">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
                </button>
            </form>
        </section>
    </main>

    <script>
        const root = document.documentElement;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
        const dateOptions = { day: '2-digit', month: 'long', year: 'numeric' };
        const goalAmount = 350000;
        const periodStart = new Date(2026, 8, 1);
        const periodEnd = new Date(2026, 11, 20);
        const travelDate = new Date(2026, 11, 25, 9, 0, 0);
        const moneyStorageKey = 'home-finance-entries';
        let entries = JSON.parse(localStorage.getItem(moneyStorageKey) || '{}');

        function formatDateKey(date) {
            return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
        }

        function getPeriodDays() {
            const days = [];
            const cursor = new Date(periodStart);
            while (cursor <= periodEnd) {
                days.push(new Date(cursor));
                cursor.setDate(cursor.getDate() + 1);
            }
            return days;
        }

        function renderProgress(container, activeCount, total, activeClass) {
            container.innerHTML = '';
            for (let index = 0; index < total; index += 1) {
                const tick = document.createElement('span');
                tick.className = `progress-tick${index < activeCount ? ` ${activeClass}` : ''}`;
                container.append(tick);
            }
        }

        function renderFinanceWidget() {
            const days = getPeriodDays();
            const today = new Date();
            const totalAmount = Object.values(entries).reduce((sum, amount) => sum + Number(amount), 0);
            const totalPeriod = periodEnd - periodStart;
            const elapsedPeriod = Math.min(Math.max(today - periodStart, 0), totalPeriod);
            const periodPercent = Math.round((elapsedPeriod / totalPeriod) * 100);
            const moneyPercent = Math.round((totalAmount / goalAmount) * 100);
            const greenHue = Math.max(82, 118 - Math.min(moneyPercent, 150) * 0.24);

            document.querySelector('#current-amount').textContent = `${totalAmount.toLocaleString('ru-RU')} ₽`;
            document.querySelector('#period-progress').textContent = `${periodPercent}%`;
            document.querySelector('#money-progress').textContent = `${moneyPercent}%`;
            root.style.setProperty('--green-hue', greenHue);
            renderProgress(document.querySelector('#period-track'), Math.ceil(elapsedPeriod / (24 * 60 * 60 * 1000)), days.length, 'period-active');
            document.querySelector('#money-track').style.width = `${Math.min(100, Math.max(0, moneyPercent))}%`;

            const grid = document.querySelector('#earnings-grid');
            const monthStrip = document.querySelector('#calendar-months');
            const gridStart = new Date(periodStart);
            gridStart.setDate(gridStart.getDate() - ((gridStart.getDay() + 6) % 7));
            const gridEnd = new Date(periodEnd);
            gridEnd.setDate(gridEnd.getDate() + (6 - ((gridEnd.getDay() + 6) % 7)));
            const weekCount = Math.round((gridEnd - gridStart) / (7 * 24 * 60 * 60 * 1000)) + 1;

            monthStrip.innerHTML = '';
            monthStrip.style.gridTemplateColumns = `repeat(${weekCount}, 8px)`;
            const monthLabels = [];
            days.forEach((day) => {
                const monthKey = `${day.getFullYear()}-${day.getMonth()}`;
                if (!monthLabels.some((month) => month.key === monthKey)) {
                    const monthStart = new Date(day);
                    const week = Math.floor((monthStart - gridStart) / (7 * 24 * 60 * 60 * 1000));
                    monthLabels.push({ key: monthKey, week, label: monthStart.toLocaleDateString('ru-RU', { month: 'short' }).replace('.', '') });
                }
            });
            monthLabels.forEach((month) => {
                const label = document.createElement('span');
                label.textContent = month.label;
                label.style.gridColumn = `${month.week + 1}`;
                monthStrip.append(label);
            });

            grid.innerHTML = '';
            const dailyTarget = goalAmount / days.length;
            for (let index = 0; index < weekCount * 7; index += 1) {
                const day = new Date(gridStart);
                day.setDate(gridStart.getDate() + index);
                const key = formatDateKey(day);
                const amount = Number(entries[key] || 0);
                const isInsidePeriod = day >= periodStart && day <= periodEnd;
                const level = amount === 0 ? 0 : amount >= dailyTarget * 2 ? 3 : amount >= dailyTarget ? 2 : 1;
                const dayButton = document.createElement('button');
                dayButton.type = 'button';
                dayButton.className = `earning-day${isInsidePeriod ? ` level-${level}` : ' is-empty'}${key === formatDateKey(today) ? ' is-today' : ''}`;
                dayButton.disabled = !isInsidePeriod;
                dayButton.textContent = '';
                dayButton.title = `${day.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}: ${amount.toLocaleString('ru-RU')} ₽`;
                dayButton.setAttribute('aria-label', dayButton.title);
                if (isInsidePeriod) {
                    dayButton.addEventListener('click', (event) => {
                        event.stopPropagation();
                        document.querySelector('#entry-date').value = key;
                        document.querySelector('#entry-amount').value = amount || '';
                        document.querySelector('#entry-amount').focus();
                    });
                }
                grid.append(dayButton);
            }
        }

        function toggleFinanceWidget() {
            const widget = document.querySelector('#finance-widget');
            const isOpen = widget.classList.toggle('is-open');
            widget.setAttribute('aria-expanded', isOpen);
        }

        document.querySelector('#finance-widget').addEventListener('click', (event) => {
            if (!event.target.closest('.finance-details')) toggleFinanceWidget();
        });
        document.querySelector('#finance-widget').addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleFinanceWidget();
            }
        });
        document.querySelector('#entry-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const date = document.querySelector('#entry-date').value;
            const amount = Math.max(0, Number(document.querySelector('#entry-amount').value || 0));
            if (!date || date < formatDateKey(periodStart) || date > formatDateKey(periodEnd)) {
                document.querySelector('#entry-note').textContent = 'Выберите дату с 1 сентября по 20 декабря.';
                return;
            }
            if (amount === 0) delete entries[date];
            else entries[date] = amount;
            localStorage.setItem(moneyStorageKey, JSON.stringify(entries));
            document.querySelector('#entry-note').textContent = 'Поступление сохранено.';
            renderFinanceWidget();
        });

        document.querySelector('#entry-date').value = formatDateKey(new Date());
        renderFinanceWidget();

        function updateHome() {
            const now = new Date();
            const hour = now.getHours();
            const daysToTravel = Math.ceil((travelDate - now) / (24 * 60 * 60 * 1000));
            const colors = hour < 6
                ? ['#090a0a', '#171918']
                : hour < 11
                    ? ['#242827', '#161918']
                    : hour < 18
                        ? ['#303634', '#1b1e1d']
                        : hour < 22
                            ? ['#1e2221', '#111413']
                            : ['#090a0a', '#171918'];

            root.style.setProperty('--background', colors[0]);
            root.style.setProperty('--background-deep', colors[1]);
            themeColor.content = colors[0];

            document.querySelector('#moscow-time').textContent = new Intl.DateTimeFormat('ru-RU', { ...timeOptions, timeZone: 'Europe/Moscow' }).format(now);
            document.querySelector('#vladivostok-time').textContent = new Intl.DateTimeFormat('ru-RU', { ...timeOptions, timeZone: 'Asia/Vladivostok' }).format(now);
            document.querySelector('#moscow-date').textContent = new Intl.DateTimeFormat('ru-RU', { ...dateOptions, timeZone: 'Europe/Moscow' }).format(now);
            document.querySelector('#travel-countdown').textContent = daysToTravel > 0 ? `D-${daysToTravel}` : 'В пути';
        }

        updateHome();
        setInterval(updateHome, 1000);
    </script>
</body>
</html>
